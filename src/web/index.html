<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeekHarness-Importer</title>
  <meta name="description" content="Bring conversations from other AI tools into DeepSeek Harness as native, resumable sessions." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="DeepSeekHarness-Importer">
        <span class="brand-mark" aria-hidden="true">
          <img src="/whale.svg" alt="" width="34" height="34" />
        </span>
        <span class="brand-name">DeepSeekHarness-Importer</span>
        <span class="badge badge-outline">v0.2</span>
      </a>

      <div class="topbar-actions">
        <div class="status-row" id="statusRow"></div>
        <a class="btn btn-ghost btn-sm" href="https://github.com/Hosseinamiri850/DeepSeekHarness-Importer" target="_blank" rel="noreferrer">
          <svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          <span class="gh-label">GitHub</span>
        </a>
        <button class="btn btn-icon" id="themeBtn" title="Theme" aria-label="Toggle theme">
          <svg class="i-sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
        <div class="lang" role="group" aria-label="Language">
          <button data-lang="en" class="active">EN</button>
          <button data-lang="fa">فا</button>
        </div>
      </div>
    </div>
  </header>

  <main class="grid">
    <!-- sessions -->
    <section class="card card-sessions" aria-labelledby="sessionsTitle">
      <div class="card-head">
        <div class="card-head-text">
          <h2 id="sessionsTitle" data-i18n="sessionsTitle">Sessions</h2>
          <p class="muted" id="sessionsMeta" data-i18n="scanning">Scanning…</p>
        </div>
        <button class="btn btn-icon" id="refreshBtn" data-i18n-title="rescan" title="Rescan">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>

      <div class="source-picker">
        <label for="sourceSelect" data-i18n="source">Source</label>
        <div class="select-wrap">
          <select id="sourceSelect"></select>
          <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>
        <p class="hint" id="sourceHint"></p>
      </div>

      <div class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
        <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Search sessions…" autocomplete="off" />
        <kbd>/</kbd>
      </div>

      <div class="filters">
        <button class="chip active" data-filter="all" data-i18n="filterAll">All</button>
        <button class="chip" data-filter="local" data-i18n="filterLocal">Local</button>
        <button class="chip" data-filter="export" data-i18n="filterExport">Export</button>
        <label class="switch" title="Show subagent transcripts">
          <input type="checkbox" id="sidechains" />
          <span class="switch-track"><span class="switch-thumb"></span></span>
          <span class="switch-label" data-i18n="subagents">Subagents</span>
        </label>
      </div>

      <ul class="list" id="sessionList" aria-live="polite"></ul>

      <div class="card-foot">
        <span class="dot" id="rootDot"></span>
        <span class="path" id="rootLabel">~/.claude/projects</span>
        <button class="btn btn-ghost btn-xs" id="uploadBtn" data-i18n-title="uploadExport" title="Upload export">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
          <span data-i18n="uploadShort">Export</span>
        </button>
        <input type="file" id="fileInput" accept="application/json,.json" hidden />
      </div>
    </section>

    <!-- detail -->
    <section class="card card-detail">
      <div class="empty" id="emptyState">
        <span class="empty-icon">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>
        </span>
        <h3 data-i18n="emptyTitle">Pick a session</h3>
        <p class="muted" data-i18n="emptyBody">Your transcripts stay on this machine. Nothing is uploaded.</p>
      </div>

      <div class="detail" id="detailBody" hidden>
        <div class="detail-head">
          <div class="detail-title-wrap">
            <div class="badges" id="detailBadges"></div>
            <h2 id="detailTitle" dir="auto"></h2>
            <div class="meta" id="detailMeta"></div>
          </div>
          <button class="btn btn-icon" id="copyIdBtn" data-i18n-title="copyId" title="Copy session id">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
          </button>
        </div>

        <div class="tabs" role="tablist">
          <button class="tab active" data-view="chat" data-i18n="tabConversation">Conversation</button>
          <button class="tab" data-view="stats" data-i18n="tabStats">Stats</button>
        </div>

        <div class="chat" id="chat"></div>
        <div class="stats" id="stats" hidden></div>
      </div>
    </section>

    <!-- import -->
    <aside class="card card-import" aria-labelledby="importTitle">
      <div class="card-head">
        <div class="card-head-text">
          <h2 id="importTitle" data-i18n="importTitle">Import to DeepSeek Harness</h2>
          <p class="muted" data-i18n="importSubtitle">Writes a native, resumable session.</p>
        </div>
      </div>

      <div class="import-body">
        <div class="field">
          <label for="workspaceSelect" data-i18n="workspace">Workspace</label>
          <div class="select-wrap">
            <select id="workspaceSelect"></select>
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <p class="hint path" id="workspaceHint"></p>
        </div>

        <div class="field">
          <label data-i18n="mode">Install as</label>
          <div class="segmented" role="radiogroup" aria-label="Install mode">
            <button class="seg active" data-mode="adopt" data-i18n="modeAdopt">Existing slot</button>
            <button class="seg" data-mode="register" data-i18n="modeRegister">New session</button>
          </div>
          <p class="hint" id="modeHint"></p>
        </div>

        <div class="field" id="slotField">
          <label for="slotSelect" data-i18n="slot">Target slot</label>
          <div class="select-wrap">
            <select id="slotSelect"></select>
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>

        <div class="field">
          <label for="maxChars" data-i18n="budget">History budget</label>
          <div class="select-wrap">
            <select id="maxChars">
              <option value="50000">50k characters</option>
              <option value="120000">120k characters</option>
              <option value="200000" selected>200k characters</option>
              <option value="400000">400k characters</option>
              <option value="0">Everything</option>
            </select>
            <svg class="chevron" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>

        <div class="field">
          <label for="titleInput" data-i18n="title">Session title</label>
          <input id="titleInput" type="text" class="input" data-i18n-placeholder="titlePlaceholder" placeholder="Claude import · project" />
        </div>
      </div>

      <div class="import-foot">
        <div class="alert alert-warning" id="warn" hidden>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
          <span id="warnText"></span>
        </div>

        <button class="btn btn-primary btn-block" id="importBtn" disabled>
          <span id="importBtnLabel" data-i18n="importButton">Import session</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>

        <div class="result" id="result" hidden></div>
      </div>
    </aside>
  </main>

  <footer class="footer">
    <span class="muted" data-i18n="footerLocal">Local-only · no network calls</span>
    <span class="sep">·</span>
    <a class="muted" href="https://github.com/Hosseinamiri850/DeepSeekHarness-Importer/blob/main/docs/USER-GUIDE.md" target="_blank" rel="noreferrer" data-i18n="guide">User guide</a>
    <span class="sep">·</span>
    <span class="muted">MIT</span>
  </footer>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
